name: Feature
about: Track a PulseBeam feature or user story
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the problem or user need.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe what should be implemented.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective conditions required to consider this work complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirements
      description: Example: RF03, RF04, RNF03
  - type: input
    id: story
    attributes:
      label: Related user story
      description: Example: US02
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Optional implementation constraints, trade-offs, or references.
